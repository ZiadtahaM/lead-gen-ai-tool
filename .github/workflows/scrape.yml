name: Live Google Maps Scrape

# Triggered remotely by the dashboard (Cloudflare Pages) via the GitHub API
# repository_dispatch event. This is the ONLY place a real headless browser
# runs — Cloudflare Workers cannot run Chromium, GitHub Actions can, and it's
# free (2,000 minutes/month on private repos, unlimited on public repos).
on:
  repository_dispatch:
    types: [scrape-leads]
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Business trade/category keyword'
        required: true
        default: 'Plumber'
      location:
        description: 'City / region to search'
        required: true
        default: 'Miami, FL, USA'
      market:
        description: 'Market dialect (ksa|egypt|usa|morocco)'
        required: true
        default: 'usa'
      max_results:
        description: 'Max results to harvest'
        required: false
        default: '12'
      job_id:
        description: 'Job ID for callback tracking'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        working-directory: ./scraper
        run: npm install

      - name: Install Playwright Chromium
        working-directory: ./scraper
        run: npx playwright install --with-deps chromium

      - name: Run live scrape
        working-directory: ./scraper
        env:
          CALLBACK_URL: ${{ secrets.LEAD_ENGINE_CALLBACK_URL }}
          IMPORT_TOKEN: ${{ secrets.LEAD_ENGINE_IMPORT_TOKEN }}
        run: |
          node scrape.mjs \
            --keyword "${{ github.event.client_payload.keyword || github.event.inputs.keyword }}" \
            --location "${{ github.event.client_payload.location || github.event.inputs.location }}" \
            --market "${{ github.event.client_payload.market || github.event.inputs.market }}" \
            --max-results "${{ github.event.client_payload.max_results || github.event.inputs.max_results || '12' }}" \
            --job-id "${{ github.event.client_payload.job_id || github.event.inputs.job_id || github.run_id }}"
